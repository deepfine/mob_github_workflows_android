name: Update Github pull-request

on:
  workflow_call:
    secrets:
      ANDROID_GITHUB:
        required: true

permissions:
  issues: write
  pull-requests: read

jobs:
  update-github-pull-request:
    if: ${{ github.event.pull_request.base.ref == 'develop' }}
    runs-on: self-hosted-android-jira
    steps:
      - name: Update pull-request's assignee and label
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.ANDROID_GITHUB }}
          script: |
            const pr = context.payload.pull_request;

            const text = `${pr.head.ref}\n${pr.title}`;
            const fromBranch = pr.head.ref.match(/\/([A-Z][A-Z0-9]+-\d+)(?:-|$)/); // 예: feature/DF-1-xxx
            const fromTitle = pr.title.match(/\b([A-Z][A-Z0-9]+-\d+)\b/);          // 예: [DF-1] xxx
            const jiraKey = (fromBranch?.[1] || fromTitle?.[1]);

            if (!jiraKey) {
              core.info("No Jira key found in branch name or PR title.");
              return;
            }

            core.info(`Jira key: ${jiraKey}`);

            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title ${jiraKey}`;
            const res = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });

            const issue = res.data.items.find(i => !i.pull_request);
            if (!issue) {
              core.info(`No open issue found with Jira key ${jiraKey} in title.`);
              return;
            }
            
            const { data: prData } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo : context.repo.repo,
              pull_number: pr.number,
            });
            
            const currentTitle = pr.title;
            const jiraPrefix = `[${jiraKey}]`;
            
            if (!currentTitle.includes(jiraPrefix)) {
              const newTitle = `${jiraPrefix} ${currentTitle}`;
            
              await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              title: newTitle,
            });
              core.info(`Updated PR title: ${newTitle}`);
            } else {
              core.info("PR title already contains Jira key. Skipping title update.");
            }
            
            const originalBody = prData.body || "";
            
            const marker = "<!-- linked-github-issue -->";
            
            if (!originalBody.includes(marker)) {
              const newBody = `${originalBody}
            
            ### 🔗 Linked Issue 
            ${marker}
            Closed #${issue.number}        
            `;
            
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo : context.repo.repo,
              pull_number: pr.number,
              body: newBody,
            });
            }
            
            const issueAssignees = issue.assignees?.map(a => a.login) ?? [];
            if (issueAssignees.length > 0) {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: issueAssignees,
              });
            }

            const issueLabels = issue.labels
              ?.map(l => typeof l === "string" ? l : l.name)
              .filter(Boolean) ?? [];
            if (issueLabels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: issueLabels,
              });
            }